<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery 📸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #lightbox{
    position:fixed; inset:0; background:rgba(32,26,29,0.9); z-index:200;
    display:none; align-items:center; justify-content:center; padding:30px;
  }
  #lightbox.open{display:flex;}
  #lightbox img{max-width:90vw; max-height:80vh; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.5);}
  #lightbox .close-btn{
    position:absolute; top:20px; right:26px; background:white; border:none;
    width:40px; height:40px; border-radius:50%; font-size:1.2rem; cursor:pointer;
  }
  .photo-slot{cursor:pointer;}
</style>
</head>
<body data-page="gallery">

<div id="float-layer"></div>
<div class="haori-sash"></div>

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="bow"><span class="bow-center"></span></span> Us</a>
  <ul>
    <li><a class="nav-link" href="index.html">Home</a></li>
    <li><a class="nav-link" href="memories.html">Our Story</a></li>
    <li><a class="nav-link" href="gallery.html">Gallery</a></li>
    <li><a class="nav-link" href="letter.html">For You</a></li>
    <li><a class="nav-link" href="admirers.html">Confession</a></li>
    <li><a class="nav-link" href="games.html">Play</a></li>
  </ul>
</nav>

<main class="page-wrap">
  <section class="center">
    <h1>Our Gallery</h1>
    <p class="script" style="font-size:1.4rem;">every picture I kept because of you</p>
    <p style="max-width:560px; margin:0 auto;">Drop your photos into <code>assets/images/</code> and list the filenames in <code>js/config.js</code> — they'll show up here and in the timeline automatically.</p>
  </section>

  <div id="gallery-grid" class="gallery-grid"></div>
</main>

<div id="lightbox">
  <button class="close-btn">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="haori-sash"></div>
<footer class="site-footer">made with 💗 by <span data-my-name>me</span>, for <span data-her-name>you</span></footer>

<div class="music-bar hidden" id="music-bar">
  <button class="play-toggle">▶</button>
  <span class="track-name">music</span>
  <button class="next-track">⏭</button>
</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('click', (e)=>{
    const img = e.target.closest('.photo-slot img');
    if(img){
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('open');
    }
    if(e.target.closest('.close-btn') || e.target.id === 'lightbox'){
      document.getElementById('lightbox').classList.remove('open');
    }
  });
</script>
</body>
</html>
